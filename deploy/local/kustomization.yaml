# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8s-explorer
resources:
  - namespace.yaml
  - postgres.yaml
  - explorer.yaml
configMapGenerator:
  - name: k8s-explorer-config
    files:
      - repositories.yaml
images:
  - name: k8s-explorer
    newTag: local
