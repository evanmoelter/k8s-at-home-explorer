apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux/ocirepository.yaml
  - flux/helmrelease.yaml
configMapGenerator:
  - name: k8s-explorer-values
    files:
      - values.yaml=app-template/values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
