[project]
name = "k8s-at-home-agent-explorer"
version = "0.1.0"
description = "Composable agent tools for community Kubernetes configuration research"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.scripts]
k8s-explorer = "k8s_explorer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_explorer"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires EXPLORER_TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]
